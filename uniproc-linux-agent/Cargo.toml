[package]
name = "uniproc-linux-agent"
version = "0.1.0"
edition.workspace = true

license.workspace = true

[dependencies]
rustc-hash = "2.1.1"
anyhow = { workspace = true, default-features = true }
env_logger = { workspace = true }
libc = { workspace = true }
log = { workspace = true }
compio = "0.18.0"
ogurpchik = { git = "https://github.com/uniproc-dev/oguRPChik", branch = "master" }
aya = "0.14"
serde_json = "1.0.149"
uniproc-protocol = { git = "https://github.com/uniproc-dev/uniproc-protocol", branch = "master" }
capnp = "0.27"
tracing = "0.1"
tracing-subscriber = "0.3.22"
futures = "0.3.32"

[build-dependencies]
aya-build = "0.2"

[[bin]]
name = "uniproc-linux-agent"
path = "src/main.rs"
